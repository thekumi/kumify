name: Container CI/CD

on:
  push:
    tags:
      - "*"
  workflow_dispatch:

enable-openid-connect: true

jobs:
  docker:
    name: Build and Push Container
    runs-on: docker-privileged
    container:
      image: node:26-bookworm
      options: >-
        --privileged

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          apt update
          apt install -y docker.io jq

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Fetch JWT
        id: jwt
        env:
          AUD: u:5:fb76291c-b485-4a7c-99a0-4dae87cd9157
        run: |
          jwt=$(
            curl --fail \
              -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
              "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=$AUD" \
              | jq -r ".value"
          )
          echo "::add-mask::$jwt"
          echo "jwt=$jwt" >> $FORGEJO_OUTPUT

      - name: Login to Forgejo
        run: |
          echo "${{ steps.jwt.outputs.jwt }}" \
            | docker login --username token --password-stdin git.private.coffee

      - name: Build and push container
        uses: docker/build-push-action@v6
        with:
          context: .
          file: contrib/podman/Containerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            git.private.coffee/privatecoffee/moodyduck:latest
            git.private.coffee/privatecoffee/moodyduck:${{ env.GITHUB_REF_NAME }}
