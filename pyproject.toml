[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "moodyduck"
version = "0.1.0"
authors = [{ name = "Kumi Mitterer", email = "kumify@kumi.email" }]
description = "A Django-based application for managing your life."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "django[argon2]",
    "django-colorfield",
    "django-multiupload",
    "django-storages",
    "django-polymorphic@git+https://github.com/jazzband/django-polymorphic.git@v4.11.1",
    "django-multiselectfield@git+https://git.private.coffee/kumi/django-multiselectfield.git",
    "django-multiupload@git+https://github.com/Chive/django-multiupload.git",
    "dbsettings",
    "django-filtersignals",
    "mysqlclient",
    "boto3",
    "argon2_cffi",
    "python-telegram-bot",
    "python-dateutil",
    "matrix-nio",
    "holoviews",
    "bokeh",
    "panel",
    "scipy",
    "channels",
    "django-autosecretkey",
    "mozilla-django-oidc",
    "python-gnupg",
    "django-crispy-forms",
    "crispy-bootstrap5",
    "django-annoying",
    "djangorestframework",
    "gunicorn",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-django>=4.10",
    "djlint>=1.36",
    "ruff>=0.11",
]

[project.scripts]
moodyduck = "moodyduck.manage:main"

[project.entry-points."moodyduck.gateways"]
telegram = "moodyduck.msgio.gateways.telegram:TelegramGateway"
matrix = "moodyduck.msgio.gateways.matrix:MatrixGateway"
ntfy = "moodyduck.msgio.gateways.ntfy:NtfyGateway"

[tool.hatch.metadata]
allow-direct-references = true

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
extend-select = ["I", "PLC0415"]
ignore = ["E501"]
exclude = ["**/migrations/*.py"]

[tool.djlint]
profile = "django"
extension = "html"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "moodyduck.settings"
python_files = ["tests.py", "test_*.py"]

[project.urls]
"Homepage" = "https://git.private.coffee/kumi/moodyduck"
"Bug Tracker" = "https://git.private.coffee/kumi/moodyduck/issues"
"Source Code" = "https://git.private.coffee/kumi/moodyduck"
